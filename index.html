<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Romance of the Three Kingdoms</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- ===== Start screen ===== -->
    <section id="start-screen">
      <div class="start-inner">
        <h1 class="title">三國志<span>Romance of the Three Kingdoms</span></h1>
        <div class="scenario-pick"><label>Scenario <select id="scenario-select" class="auto-speed"></select></label></div>
        <p class="scenario-title" id="scenario-title"></p>
        <p class="scenario-intro" id="scenario-intro"></p>
        <div class="start-actions">
          <button id="btn-continue" class="btn btn-gold" hidden>Continue Saved Game</button>
          <button id="btn-observe" class="btn btn-observe">👁 Observe the era (all warlords run by AI)</button>
          <label class="opt">Difficulty <select id="opt-difficulty" class="auto-speed"><option value="easy">Easy · your income +20%, AI slower to attack</option><option value="normal" selected>Normal</option><option value="hard">Hard · AI income +20%, bolder and colder to your envoys</option></select></label>
          <label class="opt"><input type="checkbox" id="opt-hist-deaths" checked> Scripted historical deaths <span class="opt-hint">(Sun Jian falls in 191, Dong Zhuo in 192, Cao Cao in 220...)</span></label>
        </div>
        <h2 class="choose">Choose your warlord</h2>
        <div id="faction-grid" class="faction-grid"></div>
      </div>
    </section>

    <!-- ===== Game screen ===== -->
    <section id="game-screen" hidden>
      <header id="topbar">
        <div class="tb-left">
          <span id="tb-faction" class="tb-faction"></span>
          <span id="tb-date" class="tb-date"></span>
        </div>
        <div class="tb-stats" id="tb-stats"></div>
        <div class="tb-actions">
          <span id="tb-badges" class="tb-badges"></span>
          <button class="btn tab" id="btn-overview" title="The realm (R)">Realm</button>
          <button class="btn tab" id="btn-officers" title="Officers of the realm (F)">Officers</button>
          <button class="btn tab" id="btn-diplomacy" title="Diplomacy (D)">Diplomacy</button>
          <button class="btn tab" id="btn-objectives" title="Objectives and destiny (O)">Objectives</button>
          <span id="auto-ctl" class="auto-ctl" hidden>
            <select id="auto-speed" class="auto-speed" title="Auto-play speed">
              <option value="3000">Very slow · 3s</option>
              <option value="1500">Slow · 1.5s</option>
              <option value="600" selected>Normal · 0.6s</option>
              <option value="200">Fast · 0.2s</option>
            </select>
            <label id="auto-pause-wrap" class="auto-pause" title="Stop auto-play and show a popup when a major event happens"><input type="checkbox" id="auto-pause" checked> Pause on events</label>
            <button class="btn" id="btn-auto">▶▶ Auto</button>
          </span>
          <button class="btn btn-gold" id="btn-endturn">End Month ▶</button>
          <button class="btn" id="btn-more" title="Statistics, lore, help, save and menu">≡</button>
          <div id="more-menu" class="dropdown" hidden>
            <button id="btn-stats">Statistics <kbd>S</kbd></button>
            <button id="btn-wiki">Lore <kbd>L</kbd></button>
            <button id="btn-help">Help <kbd>?</kbd></button>
            <button id="btn-legend">Legend</button>
            <button id="btn-hexmaps" title="The 13 x 12 hex battlefield of every city">Battle maps</button>
            <button id="btn-cinema">Hide interface <kbd>H</kbd></button>
            <button id="btn-save">Save</button>
            <button id="btn-menu">Main menu <kbd>M</kbd></button>
          </div>
        </div>
      </header>

      <main id="main">
        <div id="map-wrap">
          <svg id="map" viewBox="0 0 1400 1180" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="zoom-ov">
            <button id="zoom-in" title="Zoom in">+</button>
            <button id="zoom-out" title="Zoom out">−</button>
            <button id="zoom-reset" title="Refit the map (Home)">⤢</button>
            <button id="toggle-territory" title="Territory shading (off)">◧</button>
            <button id="toggle-legend" title="Legend of houses">▤</button>
          </div>
          <div id="legend" class="legend-ov" hidden></div>
          <div id="tip" class="tip" hidden></div>
          <aside id="side" class="drawer">
            <button id="drawer-close" class="drawer-close" title="Close the panel (Esc)">×</button>
            <div id="panel"></div>
          </aside>
          <button id="drawer-handle" class="drawer-handle" title="Open the panel">◂</button>
          <div id="ticker" class="ticker" title="Open the chronicle"><span class="lt" id="ticker-time"></span><span id="ticker-text"></span><span id="ticker-more" class="ticker-more"></span></div>
          <div id="chronicle" class="chronicle" hidden>
            <div class="log-title">Chronicle <button id="chron-close" class="btn-sm">Close</button></div>
            <div id="log"></div>
          </div>
          <button id="cinema-exit" class="cinema-exit" title="Show the interface (H)">▤</button>
        </div>
      </main>
    </section>

    <!-- ===== Battle screen ===== -->
    <section id="battle-screen" hidden>
      <div class="bt-head">
        <h2 id="bt-title"></h2>
        <span id="bt-day" class="bt-day"></span>
        <span id="bt-food" class="bt-food"></span>
        <span style="margin-left:auto"></span>
        <button class="btn" id="bt-logtoggle" title="Show or hide the battle log">☰ Log</button>
        <button class="btn" id="bt-help" title="How the battle works">?</button>
        <button class="btn" id="bt-close">Back to the map</button>
      </div>
      <div class="bt-main">
        <div class="bt-map"><svg id="bt-map"></svg></div>
        <aside class="bt-side">
          <div id="bt-sides"></div>
          <div id="bt-unit" class="bt-unit"></div>
          <div class="bt-actions" id="bt-actions"></div>
          <div class="log-title">Battle log</div>
          <div id="bt-log" class="bt-log"></div>
        </aside>
      </div>
    </section>

    <!-- ===== Modal ===== -->
    <div id="modal" hidden>
      <div class="modal-box" id="modal-box"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/events.js"></script>
  <script src="js/hexmaps.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/hexview.js"></script>
  <script src="js/game.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
